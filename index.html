    <script>
      (function () {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = realFetch;
          var defineFetch = function (target) {
            try {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return activeFetch || realFetch;
                },
                set: function (fn) {
                  activeFetch = typeof fn === 'function' ? fn : realFetch;
                }
              });
            } catch (_) {}
          };
          defineFetch(window);
          defineFetch(Window.prototype);
        } catch (_) {}
      })();
    </script>
